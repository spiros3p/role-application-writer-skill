name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v1.1.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF#refs/tags/}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG"

      - name: Tag must match VERSION
        run: |
          TAG='${{ steps.tag.outputs.tag }}'
          CANONICAL="$(cat VERSION)"
          EXPECTED="v${CANONICAL}"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "::error::tag $TAG does not match VERSION ($EXPECTED)"
            exit 1
          fi
          echo "ok: $TAG matches VERSION $CANONICAL"

      - name: Refuse to republish an existing release
        id: existing
        run: |
          TAG='${{ steps.tag.outputs.tag }}'
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::release $TAG already exists; published tags are immutable"
            exit 1
          fi
          echo "ok"

      - name: Full validation gate
        run: |
          ./scripts/validate.sh --strict
          echo "bundle validated at $(cat VERSION)"

      - name: Extract changelog section
        id: notes
        run: |
          VERSION="$(cat VERSION)"
          NOTES="$(awk -v want="$VERSION" '
            $0 ~ "^## \\[" want "\\]" { grab = 1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md)"
          if [ -z "${NOTES//[[:space:]]/}" ]; then
            echo "::error::no CHANGELOG.md section for $VERSION"
            exit 1
          fi
          {
            echo 'notes<<__NOTES__'
            printf '%s\n' "$NOTES"
            echo '__NOTES__'
          } >> "$GITHUB_OUTPUT"

      - name: Build the skill archive
        id: archive
        run: |
          VERSION="$(cat VERSION)"
          STAGE="$(mktemp -d)"
          mkdir -p "$STAGE/job-application-writer"
          cp -R .agents "$STAGE/job-application-writer/"
          cp LICENSE NOTICE.md README.md CHANGELOG.md VERSION bundle.json "$STAGE/job-application-writer/"
          cp -R scripts "$STAGE/job-application-writer/"
          cp -R docs "$STAGE/job-application-writer/"
          mkdir -p "$STAGE/job-application-writer/.claude-plugin"
          cp .claude-plugin/plugin.json "$STAGE/job-application-writer/.claude-plugin/"
          find "$STAGE" -name '.DS_Store' -delete

          cd "$STAGE"
          tar --exclude-vcs --sort=name --owner=0 --group=0 --numeric-owner \
              -czf "$GITHUB_WORKSPACE/job-application-writer-$VERSION.tar.gz" \
              job-application-writer
          cd "$GITHUB_WORKSPACE"

          # Reproduce the documented one-liner exactly: the archive must unpack
          # into a directory whose .agents/skills tree is directly copyable.
          rm -rf "$GITHUB_WORKSPACE/verify"
          mkdir -p "$GITHUB_WORKSPACE/verify"
          tar xzf "job-application-writer-$VERSION.tar.gz" -C "$GITHUB_WORKSPACE/verify"
          count=$(find "$GITHUB_WORKSPACE/verify/job-application-writer/.agents/skills" -name SKILL.md | wc -l | tr -d ' ')
          if [ "$count" != "8" ]; then
            echo "::error::archive contains $count skills, expected 8"
            exit 1
          fi
          echo "archive verified: $count skills"
          echo "path=job-application-writer-$VERSION.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          NOTES="${{ steps.notes.outputs.notes }}"
          {
            echo "## Install"
            echo
            echo '```bash'
            echo "git clone --branch $TAG --depth 1 https://github.com/${{ github.repository }}.git"
            echo "cd job-application-writer"
            echo "./scripts/install.sh --target global"
            echo '```'
            echo
            echo "Or fetch just the bundle:"
            echo
            echo '```bash'
            echo "curl -sSL https://github.com/${{ github.repository }}/archive/refs/tags/$TAG.tar.gz | tar xz"
            echo "cp -R job-application-writer-*/.agents/skills/* ~/.agents/skills/"
            echo '```'
            echo
            echo "Upgrade notes:"
            echo
            printf '%s\n' "$NOTES"
          } > release-notes.md

          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md \
            "${{ steps.archive.outputs.path }}"

          echo "Published $TAG"
